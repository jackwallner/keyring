name: Keyring
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Keyring:
    build:
      targets:
        Keyring: all
        KeyringTests: [test]
        KeyringUITests: [test]
    test:
      config: Debug
      targets:
        - KeyringTests
      storeKitConfiguration: Keyring.storekit
    run:
      config: Debug
      storeKitConfiguration: Keyring.storekit
  KeyringUITests:
    build:
      targets:
        Keyring: all
        KeyringUITests: [test]
    test:
      config: Debug
      targets:
        - KeyringUITests
      storeKitConfiguration: Keyring.storekit
    run:
      config: Debug

targets:
  Keyring:
    type: application
    platform: iOS
    sources:
      - path: Keyring
        excludes: ["Info.plist", "Keyring.entitlements"]
      - path: Shared
      - path: Keyring.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.keyring
        PRODUCT_NAME: Keyring
        INFOPLIST_FILE: Keyring/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyring/Keyring.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: KeyringWidget

  KeyringWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyringWidget
        excludes: ["Info.plist", "KeyringWidget.entitlements"]
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Services/WidgetSnapshot.swift
      - path: Shared/Services/DueEngine.swift
      - path: Shared/Models/VehicleKind.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.keyring.widget
        INFOPLIST_FILE: KeyringWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyringWidget/KeyringWidget.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KEYRING_WIDGET"

  KeyringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyringTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.keyring.tests
    dependencies:
      - target: Keyring

  KeyringUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyringUITests
    dependencies:
      - target: Keyring
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.keyring.uitests
        TEST_TARGET_NAME: Keyring
